<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Gestão - Cadastro de Usuários</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --error-color: #ef4444;
      --success-color: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 { font-size: 28px; font-weight: 700; color: var(--text-main); }
    header p { color: var(--text-muted); font-size: 15px; margin-top: 5px; }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover { background-color: #e2e8f0; }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    .alert-error { background-color: #fef2f2; color: var(--error-color); border: 1px solid #fecaca; }
    .alert-success { background-color: #ecfdf5; color: var(--success-color); border: 1px solid #a7f3d0; }

    .header-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 8px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
    }

    .user-info { display: flex; flex-direction: column; gap: 2px; }
    .user-name { font-weight: 600; font-size: 14px; }
    .user-email { font-size: 13px; color: var(--text-muted); }

    .badge-id {
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Gestão de Usuários</h1>
      <p>Interface Web conectada à API .NET com banco SQLite local</p>
    </header>

    <div class="grid-layout">
      
      <!-- Seção 1: Formulário de Cadastro -->
      <div class="card">
        <h2 class="card-title">Novo Cadastro</h2>
        
        <form id="cadForm">
          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex: Ana Silva" required />
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Ex: ana.silva@email.com" required />
          </div>

          <div id="mensagemAlerta" class="alert"></div>

          <button type="submit">Cadastrar Usuário</button>
        </form>
      </div>

      <!-- Seção 2: Consulta ao Banco de Dados -->
      <div class="card">
        <h2 class="card-title">Consulta ao Banco</h2>

        <div class="header-actions">
          <button type="button" onclick="carregarUsuarios()">🔍 Consultar Banco de Dados</button>
          <input type="text" id="filtro" placeholder="Filtrar resultado carregado..." oninput="filtrarUsuarios()" />
        </div>

        <div id="listaUsuarios" class="user-list">
          <div class="empty-state">Clique em "Consultar Banco de Dados" para buscar os registros.</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Ajuste a porta conforme a porta exibida pelo 'dotnet run' (ex: 5000, 5234)
    const API_URL = "http://localhost:5246/api/usuarios";
    let todosUsuarios = [];

    // Função executada APENAS ao clicar no botão "Consultar Banco de Dados"
    async function carregarUsuarios() {
      const lista = document.getElementById("listaUsuarios");
      lista.innerHTML = `<div class="empty-state">Consultando banco de dados...</div>`;

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Erro ao consultar a API.");

        todosUsuarios = await response.json();
        
        // Limpa o filtro de busca
        document.getElementById("filtro").value = "";
        
        exibirUsuarios(todosUsuarios);
      } catch (err) {
        lista.innerHTML = `<div class="empty-state" style="color: var(--error-color);">Erro ao conectar com a API.<br>Verifique se o 'dotnet run' está ativo e a porta está correta.</div>`;
      }
    }

    // Exibe os registros recebidos
    function exibirUsuarios(usuarios) {
      const lista = document.getElementById("listaUsuarios");
      lista.innerHTML = "";

      if (usuarios.length === 0) {
        lista.innerHTML = `<div class="empty-state">Nenhum registro encontrado no banco de dados.</div>`;
        return;
      }

      usuarios.forEach(u => {
        const item = document.createElement("div");
        item.className = "user-item";
        item.innerHTML = `
          <div class="user-info">
            <span class="user-name">${u.nome}</span>
            <span class="user-email">${u.email}</span>
          </div>
          <span class="badge-id">#${u.id}</span>
        `;
        lista.appendChild(item);
      });
    }

    // Filtra apenas a lista que já foi carregada em memória (sem chamar a API)
    function filtrarUsuarios() {
      const termo = document.getElementById("filtro").value.toLowerCase();
      const filtrados = todosUsuarios.filter(u => 
        u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo)
      );
      exibirUsuarios(filtrados);
    }

    // Cadastra um novo usuário via POST
    document.getElementById("cadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const alerta = document.getElementById("mensagemAlerta");
      
      alerta.style.display = "none";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, email })
        });

        if (!response.ok) {
          const erroData = await response.json();
          throw new Error(erroData.mensagem || "Erro ao realizar o cadastro.");
        }

        alerta.className = "alert alert-success";
        alerta.textContent = "Usuário cadastrado com sucesso no banco!";
        alerta.style.display = "block";

        document.getElementById("nome").value = "";
        document.getElementById("email").value = "";
      } catch (err) {
        alerta.className = "alert alert-error";
        alerta.textContent = err.message;
        alerta.style.display = "block";
      }
    });
  </script>
</body>
</html>
