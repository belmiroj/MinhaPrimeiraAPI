<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Gestão - Cadastro de Usuários</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --error-color: #ef4444;
      --error-hover: #dc2626;
      --success-color: #10b981;
      --warning-color: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    header h1 { font-size: 28px; font-weight: 700; color: var(--text-main); }
    header p { color: var(--text-muted); font-size: 15px; margin-top: 5px; }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }

    .btn-secondary {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover { background-color: #e2e8f0; }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-group button {
      flex: 1;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    .alert-error { background-color: #fef2f2; color: var(--error-color); border: 1px solid #fecaca; }
    .alert-success { background-color: #ecfdf5; color: var(--success-color); border: 1px solid #a7f3d0; }

    .header-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 8px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
    }

    .user-info { display: flex; flex-direction: column; gap: 2px; }
    .user-name { font-weight: 600; font-size: 14px; }
    .user-email { font-size: 13px; color: var(--text-muted); }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    .btn-edit {
      background-color: #fef3c7;
      color: #b45309;
    }

    .btn-edit:hover {
      background-color: #fde68a;
    }

    .btn-delete {
      background-color: #fee2e2;
      color: var(--error-color);
    }

    .btn-delete:hover {
      background-color: #fca5a5;
    }

    .badge-id {
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Gestão de Usuários</h1>
      <p>Interface Web conectada à API .NET com banco SQLite local</p>
    </header>

    <div class="grid-layout">
      
      <!-- Seção 1: Formulário de Cadastro / Edição -->
      <div class="card">
        <h2 class="card-title" id="formTitle">Novo Cadastro</h2>
        
        <form id="cadForm">
          <!-- Campo oculto para armazenar o ID ao editar -->
          <input type="hidden" id="usuarioId" value="" />

          <div class="form-group">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex: Ana Silva" required />
          </div>

          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Ex: ana.silva@email.com" required />
          </div>

          <div id="mensagemAlerta" class="alert"></div>

          <div class="btn-group">
            <button type="submit" id="btnSubmit">Cadastrar Usuário</button>
            <button type="button" id="btnCancelar" class="btn-secondary" style="display: none;" onclick="limparFormulario()">Cancelar</button>
          </div>
        </form>
      </div>

      <!-- Seção 2: Consulta ao Banco de Dados -->
      <div class="card">
        <h2 class="card-title">Consulta ao Banco</h2>

        <div class="header-actions">
          <button type="button" onclick="carregarUsuarios()">🔍 Consultar Banco de Dados</button>
          <input type="text" id="filtro" placeholder="Filtrar resultado carregado..." oninput="filtrarUsuarios()" />
        </div>

        <div id="listaUsuarios" class="user-list">
          <div class="empty-state">Clique em "Consultar Banco de Dados" para buscar os registros.</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "http://localhost:5246/api/usuarios";
    let todosUsuarios = [];

    // Função executada ao clicar no botão "Consultar Banco de Dados"
    async function carregarUsuarios() {
      const lista = document.getElementById("listaUsuarios");
      lista.innerHTML = `<div class="empty-state">Consultando banco de dados...</div>`;

      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Erro ao consultar a API.");

        todosUsuarios = await response.json();
        
        // Limpa o filtro de busca
        document.getElementById("filtro").value = "";
        
        exibirUsuarios(todosUsuarios);
      } catch (err) {
        lista.innerHTML = `<div class="empty-state" style="color: var(--error-color);">Erro ao conectar com a API.<br>Verifique se o 'dotnet run' está ativo e a porta está correta.</div>`;
      }
    }

    // Exibe os registros recebidos com os botões de Ação (Editar e Excluir)
    function exibirUsuarios(usuarios) {
      const lista = document.getElementById("listaUsuarios");
      lista.innerHTML = "";

      if (usuarios.length === 0) {
        lista.innerHTML = `<div class="empty-state">Nenhum registro encontrado no banco de dados.</div>`;
        return;
      }

      usuarios.forEach(u => {
        const item = document.createElement("div");
        item.className = "user-item";
        item.innerHTML = `
          <div class="user-info">
            <span class="user-name">${u.nome}</span>
            <span class="user-email">${u.email}</span>
          </div>
          <div class="user-actions">
            <span class="badge-id">#${u.id}</span>
            <button class="btn-icon btn-edit" onclick="prepararEdicao(${u.id}, '${u.nome}', '${u.email}')">✏️ Editar</button>
            <button class="btn-icon btn-delete" onclick="excluirUsuario(${u.id})">🗑️ Excluir</button>
          </div>
        `;
        lista.appendChild(item);
      });
    }

    // Prepara o formulário para a edição do usuário selecionado
    function prepararEdicao(id, nome, email) {
      document.getElementById("usuarioId").value = id;
      document.getElementById("nome").value = nome;
      document.getElementById("email").value = email;
      
      document.getElementById("formTitle").textContent = "Editar Usuário";
      document.getElementById("btnSubmit").textContent = "Atualizar Usuário";
      document.getElementById("btnCancelar").style.display = "block";
      
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // Reseta o formulário para o modo de cadastro
    function limparFormulario() {
      document.getElementById("usuarioId").value = "";
      document.getElementById("cadForm").reset();
      document.getElementById("formTitle").textContent = "Novo Cadastro";
      document.getElementById("btnSubmit").textContent = "Cadastrar Usuário";
      document.getElementById("btnCancelar").style.display = "none";
      document.getElementById("mensagemAlerta").style.display = "none";
    }

    // Executa Exclusão via DELETE
    async function excluirUsuario(id) {
      if (!confirm(`Tem certeza que deseja excluir o usuário #${id}?`)) return;

      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          throw new Error("Erro ao excluir usuário.");
        }

        // Se estiver editando o usuário recém-excluído, limpa o formulário
        if (document.getElementById("usuarioId").value == id) {
          limparFormulario();
        }

        // Recarrega a lista do banco
        await carregarUsuarios();
      } catch (err) {
        alert(err.message);
      }
    }

    // Filtra a lista local em memória
    function filtrarUsuarios() {
      const termo = document.getElementById("filtro").value.toLowerCase();
      const filtrados = todosUsuarios.filter(u => 
        u.nome.toLowerCase().includes(termo) || u.email.toLowerCase().includes(termo)
      );
      exibirUsuarios(filtrados);
    }

    // Submissão do Formulário (Cadastrar com POST ou Atualizar com PUT)
    document.getElementById("cadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("usuarioId").value;
      const nome = document.getElementById("nome").value;
      const email = document.getElementById("email").value;
      const alerta = document.getElementById("mensagemAlerta");
      
      alerta.style.display = "none";

      const isEditMode = Boolean(id);
      const url = isEditMode ? `${API_URL}/${id}` : API_URL;
      const method = isEditMode ? "PUT" : "POST";

      const payload = isEditMode ? { id: parseInt(id), nome, email } : { nome, email };

      try {
        const response = await fetch(url, {
          method: method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const erroData = await response.json().catch(() => null);
          throw new Error(erroData?.mensagem || "Erro ao salvar os dados.");
        }

        alerta.className = "alert alert-success";
        alerta.textContent = isEditMode 
          ? "Usuário atualizado com sucesso!" 
          : "Usuário cadastrado com sucesso no banco!";
        alerta.style.display = "block";

        limparFormulario();
        
        // Se a lista já tiver sido consultada anteriormente, recarrega para mostrar as alterações
        if (todosUsuarios.length > 0) {
          await carregarUsuarios();
        }
      } catch (err) {
        alerta.className = "alert alert-error";
        alerta.textContent = err.message;
        alerta.style.display = "block";
      }
    });
  </script>
</body>
</html>
